const formulaSections = {"SOUND": "<div class=\"eyebrow\">SOUND / EQUATIONS</div><article class=\"item\"><h2>Attack / Decay / Sustain / Release</h2><div class=\"eq\">E(t) = (1 − e^(−t/a)) · [s + (1 − s)e^(−t/d)] · e^(−t/r)</div><p>a = max(0.001, Attack/1000)、s = Sustain/100、d = 0.12 + Decay/1600、r = 1 + 3.5(0.1 + Release/1000)。</p><p class=\"hint\">ピアノの基本包絡線として実装されている式。Attackを長くすると立ち上がりが緩やかになり、DecayやReleaseを変えると減衰の仕方が変わる。ベースには別の立ち上がり式も使っている。</p></article><article class=\"item\"><h2>Volume</h2><div class=\"eq\">y = 0.85 · tanh(c · x) · (Volume/75)</div><p>xは合成した波形、cはピーク値とVelocityに応じた正規化係数。</p><p class=\"hint\">Volumeは最終出力の倍率。実際の処理ではtanhで大きすぎる振幅を抑えている。</p></article><article class=\"item\"><h2>Brightness</h2><div class=\"eq\">Aₙ ∝ n^(−q),　q = 2.28 − 0.0065·Brightness − 0.0026·Hardness</div><p>nは振動モード番号。これはピアノの倍音振幅を決める要素の一つ。</p><p class=\"hint\">Brightnessを上げると高い振動モードの振幅が相対的に残りやすい。</p></article>", "STRING": "<div class=\"eyebrow\">STRING / EQUATIONS</div><article class=\"item\"><h2>Tension / Thickness</h2><div class=\"eq\">f₁ = f_ref · √(T/100) / (D/100)</div><p>f_refは選んだ音高、TはTension、DはThickness。</p><p class=\"hint\">張力を上げると基本周波数が高くなり、太さを上げると低くなる。</p></article><article class=\"item\"><h2>Stiffness</h2><div class=\"eq\">fₙ = n f₁ √[(1 + Bn²)/(1 + B)]</div><p>B = [0.000035 + 0.00052·Stiffness/100] · (D/100)² / max(0.4,T/100)。</p><p class=\"hint\">硬さが増すと、高次モードの周波数が整数倍からずれていく。</p></article><article class=\"item\"><h2>Damping</h2><div class=\"eq\">τₙ = max(0.08, C / n^p)</div><p>C = (0.75 + 1.65·Decay/1000)(1.25 − Damping/140)、p = 0.65 + Damping/130。</p><p class=\"hint\">Dampingを上げると振動の減衰が速くなり、特に高次モードが短く残る。</p></article>", "HAMMER": "<div class=\"eyebrow\">HAMMER / EQUATIONS</div><article class=\"item\"><h2>Strike Position</h2><div class=\"eq\">Wₙ = |sin(π n x)|</div><p>x = clamp(Strike Position/100, 0.06, 0.42)。</p><p class=\"hint\">打つ位置によって、強く出る振動モードと弱くなる振動モードが変わる。</p></article><article class=\"item\"><h2>Contact Time</h2><div class=\"eq\">Hₙ = exp[−½(2π fₙ c · 0.20)²]</div><p>c = Contact Time/1000（秒）。</p><p class=\"hint\">接触時間を長くすると高周波成分が抑えられやすい。</p></article><article class=\"item\"><h2>Hardness / Velocity / Impact Noise</h2><div class=\"eq\">aₙ ∝ Wₙ · Hₙ · n^(−q)</div><p>Hardnessはqに含まれ、Velocityは出力の振幅係数に反映される。Impact Noiseは短い打撃成分の強さに使われる。</p><p class=\"hint\">打撃の硬さ・強さ・ノイズは同じ一つの式ではなく、複数の処理に分かれている。</p></article>", "RESONANCE": "<div class=\"eyebrow\">RESONANCE / EQUATIONS</div><article class=\"item\"><h2>Soundboard</h2><div class=\"eq\">y[i] ← y[i] + 0.42·b·y[i−d]</div><p>b = 0.14·Soundboard/100、dは響板の遅延サンプル数。</p><p class=\"hint\">過去の波形を少し加えて響きを近似する。実際の響板を厳密に解くモデルではない。</p></article><article class=\"item\"><h2>Room Size / Reverb</h2><div class=\"eq\">y[i] ← y[i] + 0.5·w·y[i−r]</div><p>r = round(24000·(0.028 + 0.00065·Room Size))、w = 0.06 + 0.0018·Reverb。</p><p class=\"hint\">Room Sizeは反射の遅れ、Reverbは反射の強さに関係する。</p></article><article class=\"item\"><h2>Damper</h2><div class=\"eq\">y(t) ← y(t) · exp[−max(0,t−0.12)·0.0095·Damper]</div><p>tは秒単位の時刻。</p><p class=\"hint\">Damperを上げると、音の後半がより速く小さくなる。</p></article>", "ADVANCED": "<div class=\"eyebrow\">ADVANCED / EQUATIONS</div><article class=\"item\"><h2>Modes</h2><div class=\"eq\">x(t) = Σₙ Aₙ e^(−t/τₙ) sin(2π fₙ t + φₙ)</div><p>n = 1, …, Modes。各モードの周波数・振幅・減衰時間を計算して足し合わせる。</p><p class=\"hint\">Modesを増やすと、音を構成する振動成分の数が増える。</p></article><article class=\"item\"><h2>Detuning</h2><div class=\"eq\">f₊ = f₁ · 2^(0.72c/2400)</div><p>cはDetuning設定値（cent）。実装では2本の弦に±0.36c centずつ割り当てる。</p><p class=\"hint\">わずかに異なる周波数を重ねることで、うなりが生じる。</p></article><article class=\"item\"><h2>Vibrato</h2><div class=\"eq\">ω(t) = ω₀[1 + 0.00006·Vibrato·sin(2π·5.2t)]</div><p>ω₀は元の位相増分。</p><p class=\"hint\">周期的に周波数を揺らす。</p></article>"};

 const midi=pcFormulaSource!==null&&pcFormulaMidi!==null?pcFormulaMidi:(Number(document.getElementById('note')?.value)||69);
 const ref=440*Math.pow(2,(midi-69)/12);
 const T=v('tension'),D=v('thickness'),f1=ref*Math.sqrt(T/100)/(D/100);
 const n=3, B=(.000035+.00052*v('stiffness')/100)*(D/100)**2/Math.max(.4,T/100);
 const fn=n*f1*Math.sqrt((1+B*n*n)/(1+B));
 const a=Math.max(.001,v('attack')/1000),d=.12+v('decay')/1600,s=v('sustain')/100,r=1+3.5*(.1+v('release')/1000);
 const envelope=(1-Math.exp(-t/a))*(s+(1-s)*Math.exp(-t/d))*Math.exp(-t/r);
 const C=(.75+1.65*v('decay')/1000)*(1.25-v('damping')/140),power=.65+v('damping')/130;
 const tau=Math.max(.08,C/n**power);
 const q=2.28-.0065*v('brightness')-.0026*v('hardness');
 const x=Math.min(.42,Math.max(.06,v('position')/100));
 const contact=v('contact')/1000;
 const wave=pcFormulaSource&&pcFormulaWave?pcFormulaWave:lastWave;
 const sample=wave?.out?.length?wave.out[Math.min(wave.out.length-1,Math.floor(t*wave.sr*(pcFormulaSource?pcFormulaRate:1)))]:null;
 const actualSample=sample===null?'—':fmt(sample,5);
 let sub='',value='',note='';
 if(id.startsWith('Attack /')){
  const frac=(num,den)=>`<span class="mathfrac"><span>${num}</span><span>${den}</span></span>`;
  const tt=fmt(t,2);
  sub=`E(${tt}) = (1 − e<sup>−${frac(tt,fmt(a,3))}</sup>) · [${fmt(s,2)} + ${fmt(1-s,2)}e<sup>−${frac(tt,fmt(d,2))}</sup>] · e<sup>−${frac(tt,fmt(r,2))}</sup>`;
  value=`E(${fmt(t,2)}) = ${fmt(envelope,5)}`;note='';
 }else if(id==='Volume'){
  sub=`Volume = ${v('volume')}%　/　出力波形 y[${Math.floor(t*(lastWave?.sr||44100))}]`;
  value=`y[${Math.floor(t*(lastWave?.sr||44100))}] = ${actualSample}`;note='正規化・音量調整後の音声サンプル。';
 }else if(id==='Brightness'){
  sub=`q = 2.28 − 0.0065×${v('brightness')} − 0.0026×${v('hardness')}`;
  value=`q = ${fmt(q,4)}`;note='音色設定を変えると値が変わる。';
 }else if(id.startsWith('Tension /')){
  sub=`f₁ = ${fmt(ref,2)} × √(${T}/100) ÷ (${D}/100)`;
  value=`f₁ = ${fmt(f1,2)} Hz`;
 }else if(id==='Stiffness'){
  sub=`f₃ = 3 × ${fmt(f1,2)} × √[(1 + 9 × ${fmt(B,7)})/(1 + ${fmt(B,7)})]`;
  value=`f₃ = ${fmt(fn,2)} Hz`;
 }else if(id==='Damping'){
  sub=`τ₃ = max(0.08, ${fmt(C,3)} ÷ 3^${fmt(power,3)})`;
  value=`τ₃ = ${fmt(tau,3)} s`;
 }else if(id==='Strike Position'){
  sub=`W₃ = |sin(3π × ${fmt(x,3)})|`;
  value=`W₃ = ${fmt(Math.abs(Math.sin(3*Math.PI*x)),5)}`;
 }else if(id==='Contact Time'){
  sub=`H₃ = exp[−½(2π×${fmt(fn,1)}×${fmt(contact,5)}×0.20)²]`;
  value=`H₃ = ${fmt(Math.exp(-.5*(2*Math.PI*fn*contact*.20)**2),5)}`;
 }else if(id.startsWith('Hardness /')){
  const W=Math.abs(Math.sin(n*Math.PI*x)),H=Math.exp(-.5*(2*Math.PI*fn*contact*.20)**2);
  sub=`A₃ ∝ ${fmt(W,3)} × ${fmt(H,3)} × 3^(−${fmt(q,3)})`;
  value=`W₃H₃·3^(−q) = ${fmt(W*H*Math.pow(n,-q),6)}`;
  note='正規化前の倍音係数の一部。実際の合成には他の補正もある。';
 }else if(id==='Soundboard'){
  sub=`b = 0.14 × ${v('board')}/100 = ${fmt(.14*v('board')/100,4)}`;
  value=`0.42b = ${fmt(.42*.14*v('board')/100,5)}`;
 }else if(id.startsWith('Room Size /')){
  const delay=Math.round(24000*(.028+.00065*v('room'))),w=.06+.0018*v('reverb');
  sub=`r = round(24000 × (0.028+0.00065×${v('room')}))`;
  value=`r = ${delay} samples　/　w = ${fmt(w,4)}`;
 }else if(id==='Damper'){
  sub=`g(${fmt(t,2)}) = e^(−max(0,${fmt(t,2)}−0.12)×0.0095×${v('damper')})`;
  value=`g(${fmt(t,2)}) = ${fmt(Math.exp(-Math.max(0,t-.12)*.0095*v('damper')),5)}`;
  note='時間が進むと倍率が変わる。';
 }else if(id==='Modes'){
  sub=`N = ${v('modes')}　/　t = ${fmt(t,3)} s`;
  value=`y(${fmt(t,3)}) = ${actualSample}`;
  note='実際の音声バッファからサンプル値を表示。';
 }else if(id==='Detuning'){
  sub=`f₊ = ${fmt(f1,2)} × 2^(0.72×${v('detune')}/2400)`;
  value=`f₊ = ${fmt(f1*Math.pow(2,.72*v('detune')/2400),2)} Hz`;
 }else if(id==='Vibrato'){
  sub=`ω(t)/ω₀ = 1+0.00006×${v('vibrato')}×sin(2π×5.2×${fmt(t,3)})`;
  value=`ω(t)/ω₀ = ${fmt(1+.00006*v('vibrato')*Math.sin(2*Math.PI*5.2*t),7)}`;
  note='再生時間によって位相増分の倍率が変わる。';
 }else{
  sub=`t = ${fmt(t,3)} s`;
  value=`y(${fmt(t,3)}) = ${actualSample}`;
 }
 return {sub,value,note};
}

// Fit long formulas to the available width instead of adding a horizontal scrollbar.
// Only the FORMULAS content is affected; no frame or control dimensions change.
function fitVisibleFormulaLines(){
 const panel=document.getElementById('paramList');
 if(!panel || !panel.classList.contains('formulaPanel'))return;
 const nodes=panel.querySelectorAll('.formulaSingleEq,.formulaSubstitution,.formulaResult');
 nodes.forEach(el=>{
   el.style.removeProperty('font-size');
   el.style.setProperty('font-size','18px','important');
   const available=Math.max(1,panel.clientWidth-24);
   const measured=el.scrollWidth;
   if(measured>available){
     const size=Math.max(8,18*available/measured*0.975);
     el.style.setProperty('font-size',size.toFixed(2)+'px','important');
   }
 });
}

 updateFormulaReadout();
}
// Typeset math locally without network dependencies. Expressions are presentation only.
function formulaMath(text){
 // Convert ^(expression), ^[expression], and ^number into real superscripts.
 // Balanced brackets are necessary for exponents containing max(...), fractions, etc.
 const src=String(text);
 const escapeMath=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 let html='';
 for(let i=0;i<src.length;){
  if(src[i]==='^' && i+1<src.length){
   const open=src[i+1];
   if(open==='(' || open==='['){
    const close=open==='('?')':']';
    let depth=1,j=i+2;
    for(;j<src.length && depth;j++){
     if(src[j]===open)depth++;
     else if(src[j]===close)depth--;
    }
    if(depth===0){html+='<sup>'+escapeMath(src.slice(i+2,j-1))+'</sup>';i=j;continue;}
   }else{
    const m=src.slice(i+1).match(/^[−-]?(?:[\w.]+|[₀-₉]+)/u);
    if(m){html+='<sup>'+escapeMath(m[0])+'</sup>';i+=m[0].length+1;continue;}
   }
  }
  html+=escapeMath(src[i]);i++;
 }
 html=html.replace(/\b(sin|cos|tanh|max|round)\b/g,'<span class="mathfn">$1</span>');
 return html.replace(/\*/g,'·');
}

// FORMULAS-only mathematical typography: fractions and square-root vincula.
function formulaPrettyMath(text){
 const raw=String(text);
 const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const frac=(num,den)=>`<span class="mathfrac"><span>${esc(num)}</span><span>${esc(den)}</span></span>`;
 // Native MathML keeps the radical bar over the ENTIRE fraction (both numerator and denominator).
 const radicalFraction=(num,den)=>`<math class="formulaRadical" xmlns="http://www.w3.org/1998/Math/MathML"><msqrt><mfrac><mrow><mtext>${esc(num)}</mtext></mrow><mrow><mtext>${esc(den)}</mtext></mrow></mfrac></msqrt></math>`;
 // Insert safe placeholders BEFORE exponent rendering. Never pass generated HTML
 // through formulaMath(), which would escape <sup> and <span> into visible text.
 const slots=[];
 const hold=html=>{const key=`§MATH${slots.length}§`;slots.push(html);return key;};
 let src=raw;
 // Render exp[...] as an actual exponential. Preserve the bracketed expression,
 // including nested parentheses and numerical substitutions.
 src=src.replace(/exp\[([^\]]+)\]/g,(_,exponent)=>{
  let inner=exponent.replace(/½/g,()=>hold(frac('1','2')));
  // Slots are inserted after math escaping; do not feed HTML to formulaMath.
  const exponentHtml=formulaMath(inner).replace(/§MATH(\d+)§/g,(_,n)=>slots[Number(n)]);
  return hold(`<span class="math-exp">e<sup>${exponentHtml}</sup></span>`);
 });
 // Exact symbolic forms and their live numerical substitutions.
 src=src.replace(/√\(T\/100\)/g,()=>hold(radicalFraction('T','100')));
 src=src.replace(/√\[\(1 \+ Bn²\)\/\(1 \+ B\)\]/g,()=>hold(radicalFraction('1 + Bn²','1 + B')));
 src=src.replace(/√\[\(1 \+ 9 × ([\d.]+)\)\/\(1 \+ ([\d.]+)\)\]/g,(_,a,b)=>hold(radicalFraction(`1 + 9 × ${a}`,`1 + ${b}`)));
 src=src.replace(/√\(([\d.]+)\/100\)/g,(_,n)=>hold(radicalFraction(n,'100')));
 // Damping: C / n^p (both symbolic and substituted values).
 src=src.replace(/\bC\s*\/\s*n\^p\b/g,()=>hold('<span class="mathfrac"><span>C</span><span>n<sup>p</sup></span></span>'));
 src=src.replace(/\bC\s*÷\s*n\^p\b/g,()=>hold('<span class="mathfrac"><span>C</span><span>n<sup>p</sup></span></span>'));
 src=src.replace(/([\d.]+)\s*÷\s*3\^([\d.]+)/g,(_,c,p)=>hold(`<span class="mathfrac"><span>${esc(c)}</span><span>3<sup>${esc(p)}</sup></span></span>`));
 // Cover the other slash-form fractions in the 15 formulas.
 const fixedFractions=[['Volume/75','Volume','75'],['t/τₙ','t','τₙ'],['c/2400','c','2400'],['c/1200','c','1200'],['T/100','T','100'],['D/100','D','100']];
 for(const [pattern,num,den] of fixedFractions){src=src.split(pattern).join(hold(frac(num,den)));}
 // Generic numeric fractions such as 0.68/1000, 55/100, etc.
 src=src.replace(/(?<![\w.])([0-9]+(?:\.[0-9]+)?)\s*\/\s*([0-9]+(?:\.[0-9]+)?)/g,(_,a,b)=>hold(frac(a,b)));
 // Stiffness / thickness explicit divisions.
 src=src.replace(/\(D\/100\)/g,()=>hold(frac('D','100')));
 src=src.replace(/\(([\d.]+)\/100\)/g,(_,n)=>hold(frac(n,'100')));
 let out=formulaMath(src);
 slots.forEach((html,i)=>{out=out.replace(`§MATH${i}§`,html);});
 return out;
}

<script>
/* Center the A4 selector against the visible mobile viewport, not the document. */
(function(){
 const graph=document.querySelector('.graphs');
 const note=document.getElementById('note');
 if(!graph||!note)return;
 let raf=0;
 function alignPitch(){
  if(window.innerWidth>600){graph.style.removeProperty('--centered-graph-height');return;}
  // Reset first: repeated viewport resize must not accumulate height changes.
  graph.style.removeProperty('--centered-graph-height');
  const base=graph.getBoundingClientRect().height;
  const r=note.getBoundingClientRect();
  const vv=window.visualViewport;
  const center=(vv?vv.offsetTop+vv.height/2:window.innerHeight/2)+4;
  const noteCenter=r.top+r.height/2;
  // Increasing graph height moves the following transport (and its note) down.
  const desired=Math.max(160,base+center-noteCenter);
  graph.style.setProperty('--centered-graph-height',desired+'px');
  // A layout pass can change flex sizing; correct for the measured residual.
  requestAnimationFrame(()=>{
   const actual=note.getBoundingClientRect();
   const residual=center-(actual.top+actual.height/2);
   if(Math.abs(residual)>0.75){
    const h=graph.getBoundingClientRect().height;
    graph.style.setProperty('--centered-graph-height',Math.max(160,h+residual)+'px');
   }
   if(typeof renderGraphs==='function')renderGraphs();
  });
 }
 function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(alignPitch)}
 window.addEventListener('load',schedule);
 window.addEventListener('resize',schedule);
 window.visualViewport?.addEventListener('resize',schedule);
 window.visualViewport?.addEventListener('scroll',schedule);
 schedule();
})();

function drumWave(index){
 // Deliberately electronic drum synthesis: stable oscillators, short noise bursts,
 // no attempts to imitate acoustic cymbals with sustained broadband noise.
 const sr=48000,v=drumValues,bright=v.brightness/100,damp=v.damping/100;
 const decay=(.6+v.decay/120)*(1.2-.5*damp);
 const durations=[.62,.38,.25,.14,.45,.58,.54,.50,1.05,.82];
 const N=Math.floor(sr*durations[index]*decay),out=new Float32Array(N);
 const vol=(.3+.7*v.velocity/100)*v.volume/100;
 let seed=1234567+index*654321,lo=0,hi=0,phase=0,phase2=0;
 let metalLow=0,metalMid=0,metalFast=0,metalAir=0;
 const noise=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/2147483648-1};
 const toms=[0,0,0,0,0,105,145,195,0,0];
 for(let i=0;i<N;i++){
  const t=i/sr,r=noise();
  lo+=.16*(r-lo);hi+=.52*(r-hi);
  let x=0;
  if(index===0){ // synthesized kick with pitch drop
   const f=47+125*Math.exp(-t*32)*(0.8+v.tension/250);
   phase+=2*Math.PI*f/sr;
   x=Math.sin(phase)*Math.exp(-t/(.17*decay))
     +.09*lo*Math.exp(-t/.012);
  }else if(index===1){ // electronic snare
   phase+=2*Math.PI*(175+v.tension*.35)/sr;
   x=.47*Math.sin(phase)*Math.exp(-t/(.085*decay))
     +.28*(lo+.25*(hi-lo))*Math.exp(-t/(.075*decay));
  }else if(index===2){ // synthesized clap, three gated transients
   const pulse=Math.exp(-Math.pow((t-.006)/.006,2))
     +.7*Math.exp(-Math.pow((t-.023)/.008,2))
     +.5*Math.exp(-Math.pow((t-.042)/.01,2));
   x=.36*(lo+.3*(hi-lo))*pulse;
  }else if(index>=5&&index<=7){ // electronic toms
   const f=toms[index]*(1+.3*Math.exp(-t*25));
   phase+=2*Math.PI*f/sr;
   x=.78*Math.sin(phase)*Math.exp(-t/(.18*decay))
     +.09*Math.sin(2*phase)*Math.exp(-t/.08);
  }else{
   // Cymbal/hat: bright broadband wash with a short stick tick and
   // multiple irregularly moving noise bands; no pitched chime oscillators.
   const closed=index===3,open=index===4,crash=index===8,ride=index===9;
   const tail=(closed?.075:open?.36:crash?1.18:.78)*decay;
   const attack=1-Math.exp(-t/(closed?.00045:.00085));
   const envelope=Math.exp(-t/tail);
   // Filtered bands make the noise less like static while keeping the
   // high-frequency metallic character.
   metalLow+=.055*(r-metalLow);
   metalMid+=.31*(r-metalMid);
   metalFast+=.68*(r-metalFast);
   metalAir+=.018*(r-metalAir);
   const high=r-metalMid;
   const fizz=metalFast-metalMid;
   const air=metalMid-metalAir;
   const middle=metalMid-metalLow;
   const shimmer=.86+.14*Math.abs(noise());
   const tremor=1+.065*Math.sin(2*Math.PI*(crash?17:ride?23:31)*t)+.035*Math.sin(2*Math.PI*43.7*t);
   const stick=Math.exp(-t/(closed?.0025:ride?.005:.007));
   const wash=(.56+.12*bright)*high+(.29+.10*bright)*fizz+.27*air;
   const body=(.13*fizz+.20*middle)*Math.exp(-t/(tail*.32));
   x=attack*(wash*envelope*shimmer*tremor+body
      +(.30*high+.12*middle)*stick);
   // Ride has a defined stick attack, not a bell-like sustained pitch.
   if(ride)x+=.13*high*Math.exp(-t/.012);

  }
  const shape=(.82+.18*v.hardness/100)*(.86+.14*v.board/100);

    ?Math.min(1,(N-1-i)/(sr*.016)):1;

}

function playWave(w,key,note,rate=1){

   // Stop original single-note playback without forcing its old graph renderer
   // to redraw in the middle of a drum-mode transition.
   try{stopSound()}catch(err){console.warn(err)}
   category='SOUND';tabs();renderDrumParams();
   $('note').style.visibility='hidden';
  }else{
   $('note').style.visibility='';
   if(original)original.call(this,e);
   else {renderParams();renderGraphs()}
  }
  if(this.value==='bass')octave=-1;
  else if(this.value==='piano')octave=0;
  drawKeys();invalidate();
  this.blur();
 };
 const origTabs=tabs;
 // Keep original tabs but replace only drum parameter contents.
 document.getElementById('tabs').addEventListener('click',()=>{
  if(isDrums())setTimeout(renderDrumParams,0);
 });
}
function renderDrumParams(){
 if(!isDrums()||category==='FORMULAS'||category==='COMPARE')return;
 const entries=drumDefs[category]||[];
 $('paramList').classList.remove('comparePanel','formulaPanel');
 $('paramList').innerHTML=entries.map(([id,name,description,min,max,def,unit])=>
 `<div class="param"><div class="paramLabel"><span>${name} <small>（${description}）</small></span><output id="dkv_${id}">${drumValues[id]} ${unit}</output></div>
 <input type="range" min="${min}" max="${max}" value="${drumValues[id]}" data-drum="${id}"></div>`).join('');
 document.querySelectorAll('[data-drum]').forEach(el=>el.addEventListener('input',()=>{
  drumValues[el.dataset.drum]=+el.value;
  $('dkv_'+el.dataset.drum).textContent=el.value+' '+(entries.find(x=>x[0]===el.dataset.drum)?.[6]||'');
  invalidate();
 }));
}
let mediaRecorder=null,mediaParts=[];
async function recordStart(){
 try{
  setupAudio();await audio.resume();
  if(recording)return;
  chunks=[];saved=null;mediaParts=[];
  const options=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{};
  mediaRecorder=new MediaRecorder(recorder.stream,options);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)mediaParts.push(e.data)};
  mediaRecorder.onstop=async()=>{
   try{
    const blob=new Blob(mediaParts,{type:mediaRecorder.mimeType});
    const decoded=await audio.decodeAudioData(await blob.arrayBuffer());
    const length=decoded.length;
    saved=new Float32Array(length);
    for(let c=0;c<decoded.numberOfChannels;c++){
     const channel=decoded.getChannelData(c);
     for(let i=0;i<length;i++)saved[i]+=channel[i]/decoded.numberOfChannels;
    }
    status('録音完了 '+(length/decoded.sampleRate).toFixed(1)+'秒');
    savedSampleRate=decoded.sampleRate;
   }catch(e){status('録音変換エラー: '+e.message)}
  };
  mediaRecorder.start();recording=true;
  $d('dkRecord').classList.add('dkActive');status('● 録音中');
 }catch(e){status('録音エラー: '+e.message)}
}
let savedSampleRate=44100;
function recordStop(){
 if(!recording)return;
 recording=false;$d('dkRecord').classList.remove('dkActive');
 if(mediaRecorder?.state==='recording'){mediaRecorder.stop();status('録音を変換しています…')}
}
function listen(){
 if(!saved)return status('先に録音してください');
 playWave({out:saved,sr:savedSampleRate},'recording');
}
function save(){
 if(recording)recordStop();
 if(!saved)return status('先に録音してください');
 const n=saved.length,ab=new ArrayBuffer(44+n*2),dv=new DataView(ab);
 const str=(pos,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(pos+i,s.charCodeAt(i))};
 str(0,'RIFF');dv.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');
 dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
 dv.setUint32(24,savedSampleRate,true);dv.setUint32(28,savedSampleRate*2,true);
 dv.setUint16(32,2,true);dv.setUint16(34,16,true);str(36,'data');dv.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,saved[i]));dv.setInt16(44+i*2,v<0?v*32768:v*32767,true)}
 const url=URL.createObjectURL(new Blob([ab],{type:'audio/wav'})),a=document.createElement('a');
 a.href=url;a.download='sound_explorer_recording.wav';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 status('WAV保存（16-bit PCM / '+savedSampleRate+' Hz）');
}
$d('dkRecord').onclick=recordStart;
$d('dkStop').onclick=()=>{
  recordStop();
  active.forEach(({source})=>{try{source.stop()}catch(e){}});
  active.clear();
  document.querySelectorAll('.dkKey.active').forEach(el=>el.classList.remove('active'));
};
$d('dkListen').onclick=listen;$d('dkSave').onclick=save;
$d('dkOctDown').onclick=()=>{octave=Math.max(-2,octave-1);drawKeys()};
$d('dkOctUp').onclick=()=>{octave=Math.min(2,octave+1);drawKeys()};
installDrums();drawKeys();invalidate();
// Changes to the original controls invalidate precomputed sound. No changes to their math.
let parameterTimer=null;
document.querySelector('.params').addEventListener('input',e=>{
 if(e.target.matches('input[data-param]')&&!isDrums()){
   clearTimeout(parameterTimer);
   parameterTimer=setTimeout(invalidate,450);
 }
});
document.querySelector('.params').addEventListener('change',e=>{
 if(e.target.matches('input[data-param]')&&!isDrums()){
   clearTimeout(parameterTimer);invalidate();
 }
});
})();
</script>
